name: Diagnose synthetic bold and italic (diagnostics branch, not for merging)
on:
  push:
    branches:
      - diag/synthetic-styles
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run diagnostics
        run: dotnet run --project diag/SynthDiag/SynthDiag.csproj -c Release
