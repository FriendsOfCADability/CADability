name: Windows CI

# Builds the kernel and CADability.Forms and runs both test projects on Windows. There CADability.Tests
# targets net8.0-windows and also runs the tests that need GDI+, WinForms or OpenGL (e.g. the
# comparison of the GDI+ conversions in CADability.Forms with the kernel, and the rendering of
# geometry compared against reference bitmaps), which the Linux CI compiles out (issue #412).

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ACadSharp is built from source (external/ACadSharp submodule, which
          # itself pulls in CSUtilities as a submodule)
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # ACadSharp's TargetFrameworks include net10.0, so restore needs the .NET 10 SDK.
          # The test projects target net8.0 (net8.0-windows), so its runtimes are installed as well.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the kernel
        run: dotnet build CADability/CADability.csproj -c Release

      - name: Build CADability.Forms
        run: dotnet build CADability.Forms/CADability.Forms.csproj -c Release

      - name: Run CADability.Tests
        run: >
          dotnet test tests/CADability.Tests/CADability.Tests.csproj -c Release
          --logger "trx;LogFileName=CADability.Tests.trx"
          --results-directory TestResults

      - name: Run CADability.ImportTests
        if: success() || failure()
        run: >
          dotnet test tests/CADability.ImportTests/CADability.ImportTests.csproj -c Release
          --logger "trx;LogFileName=CADability.ImportTests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/*.trx
